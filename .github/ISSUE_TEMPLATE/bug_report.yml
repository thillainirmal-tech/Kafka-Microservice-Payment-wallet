name: Bug report
description: Report a reproducible wallet-service problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe actual and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the revision and relevant Java, Kafka, Redis, database, and operating-system versions. Remove all secrets and payment data.
    validations:
      required: true
